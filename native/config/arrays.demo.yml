# Plumb — demo fleet, for demonstration purposes only
#
# Seven synthetic systems spanning all four supported vendors, wired to the
# demo exporters that ../../demo-exporter/exporter.py runs (see
# native/scripts/run-demo.sh, which starts all of them and points you at
# this file). Not real hardware, not real data — see the module docstring
# in exporter.py for exactly what it does and doesn't model.
#
# NetApp entries here use `host` directly (bypassing the native
# ONTAP/StorageGRID collector entirely) since the demo exporters aren't real
# clusters/grids with a REST or Grid Management API to authenticate against
# — see internal/targets' comment for why that's a real, supported mode and
# not just a demo trick.

arrays:
  - id: fa-prod-east-01
    name: fa-prod-east-01
    model: FA-X90R2
    vendor: pure_flasharray
    host: 127.0.0.1:9491
    scheme: http
    metrics_path: /metrics
    verify_tls: false

