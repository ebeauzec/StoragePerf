# Plumb — Pure Storage FlashBlade best-practice thresholds
#
# ⚠ LESS VERIFIED THAN THE OTHER VENDOR FILES. Pure's own metrics spec for
# FlashBlade (PureStorage-OpenConnect/pure-fb-openmetrics-exporter,
# specification/metrics/purefb-metrics.md, checked September 2026) documents
# bucket- and file-system-level metrics in full, but marks several sections
# — including `purefb_array` itself — as "TODO" / incomplete. There is
# still no confirmed array-wide latency rollup, no busy%/CPU metric, no
# confirmed network-error metric, and no confirmed replication metric —
# the same gaps as FlashArray plus one more: even the per-bucket space
# label values aren't fully published (file-system-level space is,
# though — see blade_capacity below, added once that was confirmed).
#
# What's below is deliberately incomplete rather than padded with
# guesses for the gaps above. Verify and extend against your own array
# before relying on this:
#
#   curl -sk -H "Authorization: Bearer <token>" https://<array>/metrics | less
#
# Every bucket_* metric here is category: frontend, matching
# pure_flasharray.yml's host_iops/host_bandwidth — these are client-
# facing numbers (how fast clients can read/write buckets), the same
# concept "front-end" means everywhere else in this codebase, not an
# array-internal one. They were miscategorized as backend until this was
# audited for cross-vendor consistency (2026-09-03) — fixed here, not a
# design choice to preserve.

metrics:
  - id: bucket_latency
    category: frontend
    label: "Bucket Latency (avg, read/write)"
    unit: ms
    # dimension is confirmed exactly {usec_per_other_op, usec_per_read_op,
    # usec_per_write_op} — unlike FlashArray's much richer dimension set,
    # =~"read|write" happens to match exactly the two intended values here
    # with no substring collision risk. Anchored anyway for consistency
    # with pure_flasharray.yml and to stay correct if Pure ever adds a
    # richer breakdown to this metric too.
    query: 'avg(purefb_buckets_performance_latency_usec{array="{array}",dimension=~"^(usec_per_read_op|usec_per_write_op)$"}) / 1000'
    comparison: gt
    severity_watch: 5
    severity_critical: 15
    threshold_label: "< 5 ms (illustrative)"
    finding:
      watch: "Average bucket latency is {value:.1f}ms, above the {threshold:.0f}ms illustrative ceiling."
      critical: "Average bucket latency is {value:.1f}ms, well above the {threshold:.0f}ms illustrative ceiling — clients will see this directly."
    investigate:
      - "Identify which bucket(s)/client(s) are driving the latency using per-bucket performance data."
      - "Check for a change in object-size profile or request pattern (e.g. many small objects vs. large sequential) around the time latency increased."
      - "Confirm client-side network path health (errors, retransmits) between the affected clients and the blade."
      - "Check the bucket_latency_read/bucket_latency_write panels below — a one-sided spike often points to a specific access pattern, not the blade generally."
    remediate:
      - "If a specific bucket/workload is responsible, consider isolating it (dedicated bucket policy, or a separate FlashBlade if usage grows) rather than tuning the whole array."
      - "Engage the network team if client-side network errors correlate with the latency."
      - "If latency is broad and sustained, capture a support bundle and engage Pure support."

  - id: bucket_latency_read
    category: frontend
    label: "Bucket Latency — Read"
    unit: ms
    query: 'avg(purefb_buckets_performance_latency_usec{array="{array}",dimension="usec_per_read_op"}) / 1000'
    comparison: gt
    severity_watch: 5
    severity_critical: 15
    threshold_label: "< 5 ms (illustrative)"
    finding:
      watch: "Read latency is averaging {value:.1f}ms, above the {threshold:.0f}ms illustrative ceiling — check bucket_latency_write to see whether this is read-isolated."
      critical: "Read latency is averaging {value:.1f}ms — a read-isolated spike often points to object-size/access-pattern changes rather than the blade broadly."
    investigate:
      - "If write latency is clean but read latency isn't, check for a change in read pattern (many small GETs vs. large sequential reads) or a newly cold dataset."
      - "Correlate against bucket_throughput_read — a latency spike with flat read throughput points to the blade/path, not increased read load."
    remediate:
      - "If isolated to specific buckets/clients, investigate their access pattern directly rather than tuning the whole blade."
      - "If broad and sustained, capture a support bundle and engage Pure support."

  - id: bucket_latency_write
    category: frontend
    label: "Bucket Latency — Write"
    unit: ms
    query: 'avg(purefb_buckets_performance_latency_usec{array="{array}",dimension="usec_per_write_op"}) / 1000'
    comparison: gt
    severity_watch: 5
    severity_critical: 15
    threshold_label: "< 5 ms (illustrative)"
    finding:
      watch: "Write latency is averaging {value:.1f}ms, above the {threshold:.0f}ms illustrative ceiling — check bucket_latency_read to see whether this is write-isolated."
      critical: "Write latency is averaging {value:.1f}ms — a write-isolated spike often points to ingest load or background space management, not the blade broadly."
    investigate:
      - "If read latency is clean but write latency isn't, check for an ingest burst or background space-reclamation activity."
      - "Correlate against bucket_throughput_write — a latency spike with flat write throughput points to the blade/path, not increased write load."
    remediate:
      - "If isolated to specific buckets/clients, investigate their ingest pattern directly rather than tuning the whole blade."
      - "If broad and sustained, capture a support bundle and engage Pure support."

  - id: bucket_throughput
    category: frontend
    label: "Bucket Throughput"
    unit: ops
    # This is the SUM of bucket_throughput_read + bucket_throughput_write,
    # so its thresholds must scale with that — reusing the same 100k/200k
    # as the per-direction panels would flag this "critical" whenever both
    # directions are merely at their own individually-normal levels.
    query: 'sum(purefb_buckets_performance_throughput_iops{array="{array}",dimension=~"^(reads_per_sec|writes_per_sec)$"})'
    comparison: gt
    informational: true
    severity_watch: 180000
    severity_critical: 350000
    threshold_label: "illustrative only — set from your own baseline"
    finding:
      watch: "Aggregate bucket throughput is {value:.0f} ops — this threshold is a placeholder; replace it with your array's own observed normal range."
      critical: "Aggregate bucket throughput is {value:.0f} ops — this threshold is a placeholder; replace it with your array's own observed normal range."
    investigate:
      - "Since this threshold is a placeholder, first confirm whether the observed value is actually unusual relative to this array's own historical baseline (use the 7D/30D view)."
      - "Identify which buckets are contributing most to the aggregate throughput."
      - "Check whether this coincides with a scheduled batch job, backup, or data migration."
    remediate:
      - "Replace the illustrative threshold in config/thresholds/pure_flashblade.yml with a value derived from this array's own observed normal range."
      - "If throughput is workload-driven and expected, no remediation is needed beyond confirming the array has headroom for it."
      - "If unplanned, identify and, if necessary, throttle or reschedule the responsible workload."

  - id: bucket_throughput_read
    category: frontend
    label: "Bucket Throughput — Read"
    unit: ops
    query: 'sum(purefb_buckets_performance_throughput_iops{array="{array}",dimension="reads_per_sec"})'
    comparison: gt
    informational: true
    severity_watch: 100000
    severity_critical: 200000
    threshold_label: "illustrative only — set from your own baseline"
    finding:
      watch: "Read throughput is averaging {value:.0f} ops — this threshold is a placeholder; replace it with your array's own observed normal range."
      critical: "Read throughput is averaging {value:.0f} ops — this threshold is a placeholder; replace it with your array's own observed normal range."
    investigate:
      - "First confirm whether this is actually unusual relative to this array's own historical baseline (use the 7D/30D view), since this threshold is a placeholder."
      - "Correlate against bucket_latency_read — rising throughput with flat latency is healthy scaling; flat throughput with rising latency points elsewhere."
    remediate:
      - "Replace the illustrative threshold in config/thresholds/pure_flashblade.yml with a value derived from this array's own observed normal range."

  - id: bucket_throughput_write
    category: frontend
    label: "Bucket Throughput — Write"
    unit: ops
    query: 'sum(purefb_buckets_performance_throughput_iops{array="{array}",dimension="writes_per_sec"})'
    comparison: gt
    informational: true
    severity_watch: 100000
    severity_critical: 200000
    threshold_label: "illustrative only — set from your own baseline"
    finding:
      watch: "Write throughput is averaging {value:.0f} ops — this threshold is a placeholder; replace it with your array's own observed normal range."
      critical: "Write throughput is averaging {value:.0f} ops — this threshold is a placeholder; replace it with your array's own observed normal range."
    investigate:
      - "First confirm whether this is actually unusual relative to this array's own historical baseline (use the 7D/30D view), since this threshold is a placeholder."
      - "Correlate against bucket_latency_write — rising throughput with flat latency is healthy scaling; flat throughput with rising latency points elsewhere."
    remediate:
      - "Replace the illustrative threshold in config/thresholds/pure_flashblade.yml with a value derived from this array's own observed normal range."

  - id: bucket_bandwidth_read
    category: frontend
    label: "Bucket Bandwidth — Read"
    unit: "MB/s"
    # purefb_buckets_performance_bandwidth_bytes{dimension} is real and
    # confirmed (same spec as latency/throughput above) but wasn't used
    # anywhere in this file before — FlashBlade had no bandwidth panel at
    # all until now.
    query: 'sum(purefb_buckets_performance_bandwidth_bytes{array="{array}",dimension="read_bytes_per_sec"}) / 1000000'
    comparison: gt
    informational: true
    severity_watch: 1000
    severity_critical: 2000
    threshold_label: "illustrative only — set from your own baseline"
    finding:
      watch: "Read bandwidth is averaging {value:.0f} MB/s — this threshold is a placeholder; replace it with your array's own observed normal range."
      critical: "Read bandwidth is averaging {value:.0f} MB/s — this threshold is a placeholder; replace it with your array's own observed normal range."
    investigate:
      - "First confirm whether this is actually unusual relative to this array's own historical baseline (use the 7D/30D view), since this threshold is a placeholder."
      - "Correlate against bucket_latency_read and bucket_throughput_read — a bandwidth spike with steady throughput suggests larger object sizes, not more requests."
    remediate:
      - "Replace the illustrative threshold in config/thresholds/pure_flashblade.yml with a value derived from this array's own observed normal range."

  - id: bucket_bandwidth_write
    category: frontend
    label: "Bucket Bandwidth — Write"
    unit: "MB/s"
    query: 'sum(purefb_buckets_performance_bandwidth_bytes{array="{array}",dimension="write_bytes_per_sec"}) / 1000000'
    comparison: gt
    informational: true
    severity_watch: 1000
    severity_critical: 2000
    threshold_label: "illustrative only — set from your own baseline"
    finding:
      watch: "Write bandwidth is averaging {value:.0f} MB/s — this threshold is a placeholder; replace it with your array's own observed normal range."
      critical: "Write bandwidth is averaging {value:.0f} MB/s — this threshold is a placeholder; replace it with your array's own observed normal range."
    investigate:
      - "First confirm whether this is actually unusual relative to this array's own historical baseline (use the 7D/30D view), since this threshold is a placeholder."
      - "Correlate against bucket_latency_write and bucket_throughput_write — a bandwidth spike with steady throughput suggests larger object sizes, not more requests."
    remediate:
      - "Replace the illustrative threshold in config/thresholds/pure_flashblade.yml with a value derived from this array's own observed normal range."

  - id: blade_capacity
    category: backend
    label: "Capacity Utilization"
    unit: "%"
    # purefb_file_systems_space_bytes is real and confirmed (specification/
    # metrics/purefb-metrics.md in PureStorage-OpenConnect/
    # pure-fb-openmetrics-exporter, checked September 2026) — total_physical
    # (bytes actually consumed) as a percent of provisioned (each file
    # system's nominal size), summed across every file system on the
    # blade. FlashBlade had no capacity panel at all before this — every
    # other vendor in this codebase has one; this was the last gap.
    # Scoped to file systems (NFS/SMB) specifically, not buckets: the
    # per-bucket space label values aren't fully published per this
    # file's own header comment, while file-system space is. A blade used
    # purely for S3/object workloads with no file systems provisioned
    # will show this panel as "no data" rather than a wrong number —
    # sum() over an absent metric yields no series in PromQL, not zero.
    query: 'sum(purefb_file_systems_space_bytes{array="{array}",space="total_physical"}) / sum(purefb_file_systems_space_bytes{array="{array}",space="provisioned"}) * 100'
    comparison: gt
    severity_watch: 75
    severity_critical: 85
    threshold_label: "< 75% — general storage capacity convention"
    finding:
      watch: "Capacity utilization is at {value:.0f}%, above the {threshold:.0f}% illustrative guidance."
      critical: "Capacity utilization is at {value:.0f}% — capacity, not just performance, is now a near-term risk."
    investigate:
      - "Break down usage by file system to identify what's driving growth."
      - "Check the blade's own data-reduction ratio (purefb_file_systems_space_data_reduction_ratio) for any recent regression."
      - "Review snapshot retention on the affected file system(s) — accumulated snapshots are a common silent capacity driver."
    remediate:
      - "Reclaim space via expired-snapshot cleanup or reduced retention if snapshots are the driver."
      - "Plan a capacity expansion (additional blade/chassis) if growth is workload-driven and expected to continue."
      - "Migrate or archive cold data off the blade if a specific file system is responsible for the growth."
