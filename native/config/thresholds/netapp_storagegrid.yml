# Plumb — NetApp StorageGRID best-practice thresholds
#
# Collected via Plumb's own in-process collector
# (internal/netappnative/storagegrid.go), which logs into the Grid
# Management API and runs PromQL directly against the grid's own embedded
# Prometheus — no separate poller process, works on every platform. The
# metric names below are exactly what that Prometheus itself publishes,
# unchanged by Plumb.
#
# Metric names are verified against NetApp's own published documentation
# ("Commonly used Prometheus metrics", docs.netapp.com/us-en/storagegrid)
# as of August 2026 — these are official, not reverse-engineered.
#
# As with the other vendor files, the severity_watch / severity_critical
# numbers are illustrative starting points, not published StorageGRID SLAs.
#
# None of the node_breakdown_query metrics below set
# escalate_to_node_severity, unlike netapp_ontap.yml's node_cpu_busy/
# aggr_disk_busy. That's a deliberate, researched difference, not an
# oversight: a StorageGRID grid is built specifically to absorb one bad
# node without the rest of the system inheriting the problem — erasure
# coding and replication keep object data available across multiple
# nodes' worth of redundancy, metadata reads only need a QUORUM of an
# object's own replicas rather than every node
# (docs.netapp.com/us-en/storagegrid/s3/consistency.html), and the Load
# Balancer service on every Admin/Gateway node actively weights S3
# traffic away from busy nodes
# (docs.netapp.com/us-en/storagegrid/admin/managing-load-balancing.html).
# One hot node out of possibly dozens is real and worth its own
# node-level finding (which still fires either way), but it is not the
# same event as an ONTAP HA pair losing half its compute with nothing to
# fail over to — see config.MetricDef.EscalateToNodeSeverity's own doc
# comment for the full comparison.

metrics:
  - id: metadata_query_latency
    category: frontend
    label: "Metadata Query Latency"
    unit: ms
    query: 'avg(storagegrid_metadata_queries_average_latency_milliseconds{array="{array}"})'
    # Grid-wide avg() above tells you THAT latency is elevated; this
    # breaks it back down to WHICH node, from the same underlying
    # per-node data (see internal/netappnative/storagegrid.go's
    # writeNodeBreakdowns) rather than requiring a separate trip to Grid
    # Manager to find out.
    node_breakdown_query: 'storagegrid_metadata_query_latency_by_node_ms{array="{array}"}'
    comparison: gt
    severity_watch: 50
    severity_critical: 150
    threshold_label: "< 50 ms (illustrative)"
    finding:
      watch: "Metadata query latency is averaging {value:.0f}ms, above the 50ms illustrative guidance — client-facing S3/Swift requests will feel this."
      critical: "Metadata query latency is averaging {value:.0f}ms — this directly slows every object operation on this node."
    investigate:
      - "Check this node's Cassandra/metadata service health and compaction activity — metadata latency often traces back there."
      - "Confirm this node's CPU utilization (see the back-end panel) — a busy node commonly shows up first as metadata latency."
      - "Use this panel's per-node breakdown to see whether the latency is isolated to one node or grid-wide."
    remediate:
      - "If isolated to one node, investigate that node's local resource pressure (CPU, disk I/O) directly."
      - "If grid-wide, review recent ingest-volume growth against the grid's provisioned metadata capacity."
      - "Engage NetApp support with a case if metadata service errors are also present in the node's logs."

  - id: s3_error_rate
    category: frontend
    label: "S3 Operation Failure Rate"
    unit: "failures/min"
    query: 'sum(rate(storagegrid_s3_operations_failed{array="{array}"}[5m])) * 60'
    node_breakdown_query: 'storagegrid_s3_error_rate_by_node_per_min{array="{array}"}'
    comparison: gt
    severity_watch: 5
    severity_critical: 30
    threshold_label: "< 5 / min (illustrative)"
    finding:
      watch: "S3 operations are failing at {value:.0f}/min — check client error codes (4xx vs 5xx) to narrow down auth vs. server-side causes."
      critical: "S3 operations are failing at {value:.0f}/min — this is client-visible and worth immediate attention."
    investigate:
      - "Break down failures by HTTP status code (4xx vs. 5xx) — 4xx points to client/auth issues, 5xx to the grid itself."
      - "Check whether failures are concentrated on specific buckets, tenants, or client IPs."
      - "Correlate against node CPU and metadata query latency for the same window (see back-end/front-end panels)."
    remediate:
      - "For 4xx-dominant failures, work with the affected client/tenant on credentials or request formatting — this isn't a grid-health issue."
      - "For 5xx-dominant failures correlating with node load, address the underlying resource pressure on that node."
      - "Escalate to NetApp support if 5xx errors persist with no clear resource cause."

  - id: network_errors
    category: frontend
    label: "Network Interface Errors"
    unit: "errors/min"
    # Industry practice (Brocade/Cisco FC troubleshooting guidance, general
    # Ethernet physical-layer diagnostics) treats CRC/link errors as a fault
    # to eliminate, not a rate to tolerate — the accepted baseline is zero,
    # and any sustained nonzero count means a marginal cable/SFP/port.
    # severity_watch is a negligible epsilon rather than a literal 0: the
    # engine classifies with value >= watch, so 0 exactly would misclassify
    # an actually-clean link (which reports precisely 0.0) as permanently
    # "Watch". Any real error pushes the rate well above this epsilon.
    query: 'sum(rate(node_network_receive_errs_total{array="{array}"}[5m]) + rate(node_network_transmit_errs_total{array="{array}"}[5m])) * 60'
    node_breakdown_query: 'storagegrid_network_errors_by_node_per_min{array="{array}"}'
    comparison: gt
    severity_watch: 0.01
    severity_critical: 5
    threshold_label: "> 0 / min — any sustained rate is a physical-layer fault"
    finding:
      watch: "Network interface errors are occurring ({value:.2f}/min) — industry practice treats any sustained nonzero rate as a physical-layer fault, not background noise. Check cabling/NIC health on this node."
      critical: "Network interface error rate is {value:.1f}/min — an actively degrading link, a plausible cause of client-visible slowness."
    investigate:
      - "Use this panel's per-node breakdown to identify the specific node, then check its interface-level counters directly."
      - "Check the physical layer: cable, NIC, and the switch port's own error counters."
      - "Review recent cabling, NIC, or switch-side changes on this node."
    remediate:
      - "Reseat or replace the cable/NIC on the affected interface."
      - "Engage the network team if the switch-side port also reports errors."
      - "Monitor client-facing error rates on this node while the link is repaired, since StorageGRID load balancing may route around it."

  - id: node_cpu
    category: backend
    label: "Node CPU Utilization"
    unit: "%"
    # 70%/85% is modeled on NetApp's own documented ONTAP per-node CPU
    # guidance (see node_cpu_busy in netapp_ontap.yml) — but that KB is
    # specifically about ONTAP controllers running WAFL, not StorageGRID's
    # LDR/ADC/CMN service nodes, which have different CPU/workload
    # characteristics. Treat this as a reasonable starting convention
    # carried over by analogy, not an independently confirmed StorageGRID
    # number.
    query: 'avg(storagegrid_node_cpu_utilization_percentage{array="{array}"})'
    node_breakdown_query: 'storagegrid_node_cpu_by_node_pct{array="{array}"}'
    comparison: gt
    severity_watch: 70
    severity_critical: 85
    threshold_label: "< 70% sustained (ONTAP-convention analogy — not independently published for StorageGRID)"
    finding:
      watch: "Node CPU utilization is averaging {value:.0f}%, above the 70% sustained guidance."
      critical: "Node CPU utilization is averaging {value:.0f}% — the node itself is now a contributing factor to any client-facing slowness."
    investigate:
      - "Use this panel's per-node breakdown to find which node is hottest, then identify which service (LDR, ADC, CMN, metadata) is consuming its CPU."
      - "Check for a recent increase in ingest rate, ILM policy complexity, or scan/verification jobs."
      - "Compare the breakdown across nodes in the same site to see if load is unevenly distributed."
    remediate:
      - "Rebalance client/load-balancer traffic away from this node if others have more headroom."
      - "Simplify or reschedule ILM policy evaluation if it's a major CPU contributor."
      - "If sustained grid-wide, this is a capacity signal — plan additional storage nodes."

  - id: ilm_backlog
    category: backend
    label: "ILM Evaluation Backlog"
    unit: objects
    query: 'sum(storagegrid_ilm_awaiting_total_objects{array="{array}"})'
    node_breakdown_query: 'storagegrid_ilm_backlog_by_node_objects{array="{array}"}'
    comparison: gt
    severity_watch: 100000
    severity_critical: 1000000
    threshold_label: "< 100,000 objects (illustrative)"
    finding:
      watch: "{value:.0f} objects are awaiting ILM evaluation — a growing backlog here is an early signal of a node falling behind, before it shows up as client latency."
      critical: "{value:.0f} objects are awaiting ILM evaluation — this node is materially behind on lifecycle management, which risks both performance and policy compliance (replication/erasure-coding placement)."
    investigate:
      - "Use this panel's per-node breakdown to see whether the backlog is isolated to one node or spread grid-wide, and whether it correlates with recent ingest bursts."
      - "Review ILM policy complexity — policies with many placement rules or evaluation criteria take longer per object."
      - "Confirm this node's CPU and metadata latency aren't independently elevated and causing the backlog as a side effect."
    remediate:
      - "If ingest-burst driven and temporary, monitor — the backlog should drain once ingest returns to normal."
      - "If policy-driven, simplify the ILM policy's evaluation logic where possible."
      - "If node resource-constrained, address the underlying CPU/latency issue first; the backlog is usually a symptom, not the root cause."

  - id: storage_capacity
    category: backend
    label: "Storage Capacity Used"
    unit: "%"
    # 80%/90% line up with the general storage-industry capacity convention
    # (also mirrored in NetApp's own ONTAP aggregate-growth guidance, see
    # netapp_ontap.yml) — not a StorageGRID-specific published number, since
    # no such NetApp doc was found for the grid specifically, but the same
    # "plan ahead of scarcity" reasoning applies to object storage nodes.
    query: '100 * (1 - (storagegrid_storage_utilization_usable_space_bytes{array="{array}"} / storagegrid_storage_utilization_total_space_bytes{array="{array}"}))'
    node_breakdown_query: 'storagegrid_storage_capacity_by_node_pct{array="{array}"}'
    comparison: gt
    severity_watch: 80
    severity_critical: 90
    threshold_label: "< 80% — general storage capacity convention"
    finding:
      watch: "Storage capacity is at {value:.0f}% used, above the 80% guidance."
      critical: "Storage capacity is at {value:.0f}% used — new object ingest is at risk on this node, not just performance."
    investigate:
      - "Use this panel's per-node breakdown to see which node is closest to full, then break down its usage by tenant/bucket to identify what's driving growth."
      - "Check ILM policy placement — verify objects are being tiered/erasure-coded as intended rather than left in a more space-intensive state."
      - "Review ingest-rate trend over the reporting window (7D/30D) to project time-to-full."
    remediate:
      - "Expand storage capacity (additional nodes/volumes) if growth is sustained and expected to continue."
      - "Review and correct ILM policy if objects aren't reaching their intended, more space-efficient placement tier."
      - "Engage the responsible tenant if a single tenant's growth is disproportionate."

  - id: s3_bandwidth_ingested
    category: frontend
    label: "S3 Bandwidth — Ingested (write)"
    unit: "MB/s"
    # storagegrid_s3_data_transfers_bytes_ingested is public, documented,
    # and stable (docs.netapp.com/us-en/storagegrid "Commonly used
    # Prometheus metrics") — StorageGRID had no bandwidth metric in Plumb
    # at all before this. Like Pure's IOPS/bandwidth panels, higher isn't
    # inherently bad — this is workload characterization for correlating
    # against latency/error-rate panels, not an alert to tune on its own.
    query: 'rate(storagegrid_s3_data_transfers_bytes_ingested{array="{array}"}[5m]) / 1000000'
    node_breakdown_query: 'storagegrid_s3_bytes_ingested_by_node_per_sec{array="{array}"} / 1000000'
    comparison: gt
    informational: true
    severity_watch: 500
    severity_critical: 1000
    threshold_label: "illustrative only — set from your own baseline"
    finding:
      watch: "S3 ingest rate is averaging {value:.0f} MB/s — this threshold is a placeholder; replace it with your grid's own observed normal range."
      critical: "S3 ingest rate is averaging {value:.0f} MB/s — this threshold is a placeholder; replace it with your grid's own observed normal range."
    investigate:
      - "First confirm whether this is actually unusual relative to this grid's own historical baseline (use the 7D/30D view), since this threshold is a placeholder."
      - "Correlate against metadata_query_latency and node_cpu — a bandwidth spike with rising latency suggests the grid is genuinely under ingest pressure, not just busy."
      - "Use this panel's per-node breakdown to see whether ingest is concentrated on one node rather than balanced across the grid."
    remediate:
      - "Replace the illustrative threshold in config/thresholds/netapp_storagegrid.yml with a value derived from this grid's own observed normal range."
      - "If ingest is unbalanced across nodes, review load-balancer endpoint configuration."

  - id: s3_bandwidth_retrieved
    category: frontend
    label: "S3 Bandwidth — Retrieved (read)"
    unit: "MB/s"
    query: 'rate(storagegrid_s3_data_transfers_bytes_retrieved{array="{array}"}[5m]) / 1000000'
    node_breakdown_query: 'storagegrid_s3_bytes_retrieved_by_node_per_sec{array="{array}"} / 1000000'
    comparison: gt
    informational: true
    severity_watch: 500
    severity_critical: 1000
    threshold_label: "illustrative only — set from your own baseline"
    finding:
      watch: "S3 retrieval rate is averaging {value:.0f} MB/s — this threshold is a placeholder; replace it with your grid's own observed normal range."
      critical: "S3 retrieval rate is averaging {value:.0f} MB/s — this threshold is a placeholder; replace it with your grid's own observed normal range."
    investigate:
      - "First confirm whether this is actually unusual relative to this grid's own historical baseline (use the 7D/30D view), since this threshold is a placeholder."
      - "Correlate against metadata_query_latency — a retrieval spike with rising latency suggests genuine read pressure, not just a busy grid."
      - "Use this panel's per-node breakdown to see whether retrieval is concentrated on one node rather than balanced across the grid."
    remediate:
      - "Replace the illustrative threshold in config/thresholds/netapp_storagegrid.yml with a value derived from this grid's own observed normal range."
      - "If retrieval is unbalanced across nodes, review load-balancer endpoint configuration."

  - id: s3_ops_get
    category: frontend
    label: "S3 Operations — GET"
    unit: "ops/min"
    # Sourced from storagegrid_private_s3_total_requests{type=~"get_.*"} —
    # the exact query behind NetApp's own bundled Grafana dashboard's "Top
    # Nodes by GET Operations" panel (grafana/dashboards/storagegrid/s3.json
    # in NetApp/harvest). Genuinely real and working today, but NetApp
    # documents that any metric with "_private_" in its name can change or
    # disappear without notice between StorageGRID releases — if that
    # happens, this panel just stops reporting (the collector's own
    # "unavailable" note fires) rather than anything breaking. Treat this
    # one specifically as lower-confidence than the rest of this file.
    query: 'rate(storagegrid_s3_operations_get{array="{array}"}[5m]) * 60'
    node_breakdown_query: 'storagegrid_s3_get_by_node_per_min{array="{array}"}'
    comparison: gt
    informational: true
    severity_watch: 100000
    severity_critical: 200000
    threshold_label: "illustrative only — set from your own baseline (sourced from a private metric — see comment)"
    finding:
      watch: "S3 GET rate is averaging {value:.0f}/min — this threshold is a placeholder; replace it with your grid's own observed normal range."
      critical: "S3 GET rate is averaging {value:.0f}/min — this threshold is a placeholder; replace it with your grid's own observed normal range."
    investigate:
      - "First confirm whether this is actually unusual relative to this grid's own historical baseline (use the 7D/30D view), since this threshold is a placeholder."
      - "Correlate against s3_bandwidth_retrieved and metadata_query_latency — rising GETs with flat latency is healthy scaling; flat GETs with rising latency points elsewhere."
      - "If this panel shows unavailable, StorageGRID's private per-operation-type metric may have changed between releases — the grid-wide s3_error_rate/s3_bandwidth panels are unaffected."
    remediate:
      - "Replace the illustrative threshold in config/thresholds/netapp_storagegrid.yml with a value derived from this grid's own observed normal range."

  - id: s3_ops_put
    category: frontend
    label: "S3 Operations — PUT"
    unit: "ops/min"
    # Same private-metric sourcing and caveat as s3_ops_get above.
    query: 'rate(storagegrid_s3_operations_put{array="{array}"}[5m]) * 60'
    node_breakdown_query: 'storagegrid_s3_put_by_node_per_min{array="{array}"}'
    comparison: gt
    informational: true
    severity_watch: 100000
    severity_critical: 200000
    threshold_label: "illustrative only — set from your own baseline (sourced from a private metric — see comment)"
    finding:
      watch: "S3 PUT rate is averaging {value:.0f}/min — this threshold is a placeholder; replace it with your grid's own observed normal range."
      critical: "S3 PUT rate is averaging {value:.0f}/min — this threshold is a placeholder; replace it with your grid's own observed normal range."
    investigate:
      - "First confirm whether this is actually unusual relative to this grid's own historical baseline (use the 7D/30D view), since this threshold is a placeholder."
      - "Correlate against s3_bandwidth_ingested and metadata_query_latency — rising PUTs with flat latency is healthy scaling; flat PUTs with rising latency points elsewhere."
      - "If this panel shows unavailable, StorageGRID's private per-operation-type metric may have changed between releases — the grid-wide s3_error_rate/s3_bandwidth panels are unaffected."
    remediate:
      - "Replace the illustrative threshold in config/thresholds/netapp_storagegrid.yml with a value derived from this grid's own observed normal range."
