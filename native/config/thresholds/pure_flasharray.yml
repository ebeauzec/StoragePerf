# Plumb — best-practice thresholds
#
# This file is the entire "brain" of the enrichment layer: every panel on
# the dashboard and every finding in the Findings feed comes from evaluating
# one of these entries. Add a metric here and it appears everywhere with no
# code changes.
#
# TWO THINGS TO KNOW BEFORE TRUSTING AN ALERT FROM THIS FILE:
#
# 1. Metric names are verified against Pure Storage's public native
#    OpenMetrics naming (the `purefa_*` convention documented by the
#    PureStorage-OpenConnect/pure-fa-openmetrics-exporter project) as of
#    August 2026. That project's README confirms these metric names exist —
#    but it also confirms some things do NOT exist as public metrics:
#    controller busy%/CPU and internal media service-time have no published
#    metric, and there is no Fibre-Channel-specific port utilization or CRC
#    error counter — only a generic `purefa_network_interface_performance_*`
#    family with no confirmed FC-vs-Ethernet label. That's why the back-end
#    column below is thinner than the front-end one: it reflects what's
#    actually published today, not a gap in this file. If your array exposes
#    more (a newer Purity release, or your own REST-API bridge), extend this
#    file the same way.
#
# 2. Pure does not publish universal numeric performance SLAs. Every
#    severity_watch / severity_critical value below is an illustrative
#    starting point, not an official threshold. Tune them to your own
#    array's observed baseline after a few weeks of real history.
#
# Before relying on any of this in production, confirm against your own
# array:
#
#   curl -sk -H "Authorization: Bearer <token>" https://<array>/metrics | less
#
# Fields:
#   id                 unique key, used as the panel/finding identifier
#   category           frontend | backend  (which console column it renders in)
#   label              panel title shown in the UI
#   unit               display unit
#   query              PromQL, with {array} substituted for the array id
#   comparison         gt = higher is worse (the only mode implemented today)
#   severity_watch     value at/above this is "Watch"
#   severity_critical  value at/above this is "Critical"
#   threshold_label    human-readable ceiling shown under the chart
#   finding.watch/critical  message templates; {value} and {threshold} are
#                      filled in from the evaluated metric

metrics:
  - id: host_latency
    category: frontend
    label: "Host-Side Latency (avg)"
    unit: ms
    # purefa_array_performance_latency_usec{dimension} is real and confirmed
    # (specification/metrics/purefa-metrics.md in
    # PureStorage-OpenConnect/pure-fa-openmetrics-exporter) — but its real
    # dimension set is much richer than "read/write": alongside
    # usec_per_read_op/usec_per_write_op/usec_per_mirrored_write_op/
    # usec_per_other_op, it also includes internal sub-component
    # breakdowns (queue_usec_per_read_op, san_usec_per_read_op,
    # service_usec_per_read_op, qos_rate_limit_usec_per_read_op, and their
    # write equivalents). The previous query here,
    # dimension=~"read|write", was an UNANCHORED regex — =~ matches the
    # substring anywhere in the value, so it silently pulled in every one
    # of those sub-component dimensions too (they all contain "read" or
    # "write"), not just the two intended end-to-end op dimensions. Fixed
    # to an exact alternation so this is genuinely avg(read op latency,
    # write op latency) and nothing else.
    query: 'avg(purefa_array_performance_latency_usec{array="{array}",dimension=~"^(usec_per_read_op|usec_per_write_op)$"}) / 1000'
    comparison: gt
    severity_watch: 2.0
    severity_critical: 3.5
    threshold_label: "< 2.0 ms sustained"
    finding:
      watch: "Host-side latency is averaging {value:.1f}ms, above the {threshold:.1f}ms illustrative ceiling."
      critical: "Host-side latency is averaging {value:.1f}ms, well above the {threshold:.1f}ms illustrative ceiling — hosts will see this directly."
    investigate:
      - "Check the array's front-end port statistics for retries, CRC errors, or link resets on the affected FC/iSCSI ports."
      - "Correlate the latency spike against host-side queue depth and multipath failover events in the same window."
      - "Confirm host HBA/NIC firmware and driver versions, and check for recent SAN fabric or switch changes."
      - "Check the host_latency_read/host_latency_write panels below — a one-sided spike often points to a specific workload or replication target, not the array generally."
    remediate:
      - "If a specific host or LUN is disproportionately affected, review its queue depth and multipathing configuration first."
      - "If errors/retries are found on a specific port, engage the SAN team to inspect the cable/SFP or switch port."
      - "If latency is broad-based and back-end metrics are also degraded, escalate to Pure support with a support bundle covering this window."

  - id: host_latency_read
    category: frontend
    label: "Host-Side Latency — Read"
    unit: ms
    query: 'avg(purefa_array_performance_latency_usec{array="{array}",dimension="usec_per_read_op"}) / 1000'
    comparison: gt
    severity_watch: 2.0
    severity_critical: 3.5
    threshold_label: "< 2.0 ms sustained"
    finding:
      watch: "Read latency is averaging {value:.1f}ms, above the {threshold:.1f}ms illustrative ceiling — and write latency is not necessarily also elevated (see the Write panel)."
      critical: "Read latency is averaging {value:.1f}ms — check whether write latency is clean (host_latency_write) to tell a read-side problem (cache misses, a degraded read path) from a broad one."
    investigate:
      - "If write latency is clean but read latency isn't, suspect a read-cache miss pattern, a cold dataset, or a specific host's read-heavy workload rather than the array broadly."
      - "Check host_iops_read alongside this — a read latency spike with flat read IOPS points to the array/path, not increased read load."
      - "Compare against host_latency_write and host_latency (combined) to see whether this is isolated or part of a broader front-end issue."
    remediate:
      - "If isolated to specific hosts/volumes, review their read caching configuration and working-set size against available array cache."
      - "If broad and correlated with back-end signals, treat as a general array/path issue — see the combined host_latency finding's remediation."

  - id: host_latency_write
    category: frontend
    label: "Host-Side Latency — Write"
    unit: ms
    query: 'avg(purefa_array_performance_latency_usec{array="{array}",dimension="usec_per_write_op"}) / 1000'
    comparison: gt
    severity_watch: 2.0
    severity_critical: 3.5
    threshold_label: "< 2.0 ms sustained"
    finding:
      watch: "Write latency is averaging {value:.1f}ms, above the {threshold:.1f}ms illustrative ceiling — and read latency is not necessarily also elevated (see the Read panel)."
      critical: "Write latency is averaging {value:.1f}ms — a common cause is background space-reclamation/garbage-collection or replication competing for the same write path, not client load."
    investigate:
      - "If read latency is clean but write latency isn't, check replication_lag and pool_saturation first — write-path contention often shows there before it shows here."
      - "Check host_iops_write alongside this — a write latency spike with flat write IOPS points to the array/path, not increased write load."
      - "Review recent snapshot schedules or space-reclamation activity, which competes for the same write path."
    remediate:
      - "If correlated with replication or capacity pressure, address that root cause directly rather than tuning the write path in isolation."
      - "If isolated to specific hosts/volumes, review their write pattern (sync vs. async, block size) against the array's recommended profile."

  - id: host_iops_read
    category: frontend
    label: "Host IOPS — Read"
    unit: ops
    # purefa_array_performance_throughput_iops{dimension} is real and
    # confirmed (same spec as above). Unlike latency, higher IOPS isn't
    # inherently bad — there's no universal "too much" ceiling — so this
    # is workload characterization, same framing as FlashBlade's
    # bucket_throughput: the value is for correlating against a latency
    # panel (did latency rise because load rose, or didn't it?), not an
    # alert to tune to on its own.
    query: 'sum(purefa_array_performance_throughput_iops{array="{array}",dimension="reads_per_sec"})'
    comparison: gt
    informational: true
    severity_watch: 100000
    severity_critical: 200000
    threshold_label: "illustrative only — set from your own baseline"
    finding:
      watch: "Read IOPS are averaging {value:.0f} — this threshold is a placeholder; replace it with your array's own observed normal range."
      critical: "Read IOPS are averaging {value:.0f} — this threshold is a placeholder; replace it with your array's own observed normal range."
    investigate:
      - "First confirm whether this is actually unusual relative to this array's own historical baseline (use the 7D/30D view), since this threshold is a placeholder."
      - "Correlate against host_latency_read — rising IOPS with flat latency is healthy scaling; flat IOPS with rising latency points elsewhere."
      - "Check whether this coincides with a scheduled batch job, backup, or a new host coming online."
    remediate:
      - "Replace the illustrative threshold in config/thresholds/pure_flasharray.yml with a value derived from this array's own observed normal range."
      - "If workload-driven and expected, no remediation needed beyond confirming the array has headroom."

  - id: host_iops_write
    category: frontend
    label: "Host IOPS — Write"
    unit: ops
    query: 'sum(purefa_array_performance_throughput_iops{array="{array}",dimension="writes_per_sec"})'
    comparison: gt
    informational: true
    severity_watch: 100000
    severity_critical: 200000
    threshold_label: "illustrative only — set from your own baseline"
    finding:
      watch: "Write IOPS are averaging {value:.0f} — this threshold is a placeholder; replace it with your array's own observed normal range."
      critical: "Write IOPS are averaging {value:.0f} — this threshold is a placeholder; replace it with your array's own observed normal range."
    investigate:
      - "First confirm whether this is actually unusual relative to this array's own historical baseline (use the 7D/30D view), since this threshold is a placeholder."
      - "Correlate against host_latency_write — rising IOPS with flat latency is healthy scaling; flat IOPS with rising latency points elsewhere."
      - "Check whether this coincides with a scheduled batch job, backup, snapshot, or replication resync."
    remediate:
      - "Replace the illustrative threshold in config/thresholds/pure_flasharray.yml with a value derived from this array's own observed normal range."
      - "If workload-driven and expected, no remediation needed beyond confirming the array has headroom."

  - id: host_bandwidth_read
    category: frontend
    label: "Host Bandwidth — Read"
    unit: "MB/s"
    # purefa_array_performance_bandwidth_bytes{dimension} is real and
    # confirmed (same spec). Converted bytes/sec -> MB/s for readability.
    # Same workload-characterization framing as the IOPS panels above.
    query: 'sum(purefa_array_performance_bandwidth_bytes{array="{array}",dimension="read_bytes_per_sec"}) / 1000000'
    comparison: gt
    informational: true
    severity_watch: 1000
    severity_critical: 2000
    threshold_label: "illustrative only — set from your own baseline"
    finding:
      watch: "Read bandwidth is averaging {value:.0f} MB/s — this threshold is a placeholder; replace it with your array's own observed normal range."
      critical: "Read bandwidth is averaging {value:.0f} MB/s — this threshold is a placeholder; replace it with your array's own observed normal range."
    investigate:
      - "First confirm whether this is actually unusual relative to this array's own historical baseline (use the 7D/30D view), since this threshold is a placeholder."
      - "Correlate against host_latency_read and host_iops_read — a bandwidth spike with steady IOPS suggests larger I/O sizes, not more operations."
    remediate:
      - "Replace the illustrative threshold in config/thresholds/pure_flasharray.yml with a value derived from this array's own observed normal range."
      - "If workload-driven and expected, no remediation needed beyond confirming the array has headroom."

  - id: host_bandwidth_write
    category: frontend
    label: "Host Bandwidth — Write"
    unit: "MB/s"
    query: 'sum(purefa_array_performance_bandwidth_bytes{array="{array}",dimension="write_bytes_per_sec"}) / 1000000'
    comparison: gt
    informational: true
    severity_watch: 1000
    severity_critical: 2000
    threshold_label: "illustrative only — set from your own baseline"
    finding:
      watch: "Write bandwidth is averaging {value:.0f} MB/s — this threshold is a placeholder; replace it with your array's own observed normal range."
      critical: "Write bandwidth is averaging {value:.0f} MB/s — this threshold is a placeholder; replace it with your array's own observed normal range."
    investigate:
      - "First confirm whether this is actually unusual relative to this array's own historical baseline (use the 7D/30D view), since this threshold is a placeholder."
      - "Correlate against host_latency_write and host_iops_write — a bandwidth spike with steady IOPS suggests larger I/O sizes, not more operations."
    remediate:
      - "Replace the illustrative threshold in config/thresholds/pure_flasharray.yml with a value derived from this array's own observed normal range."
      - "If workload-driven and expected, no remediation needed beyond confirming the array has headroom."

  - id: host_queue_depth
    category: frontend
    label: "Outstanding Host I/O (queue depth)"
    unit: ops
    # purefa_array_performance_queue_depth_ops is real and confirmed
    # (array-wide, not per-port — Pure's public exporter doesn't break this
    # out per FC/iSCSI port).
    query: 'avg(purefa_array_performance_queue_depth_ops{array="{array}"})'
    comparison: gt
    severity_watch: 350
    severity_critical: 450
    threshold_label: "< 350 (illustrative)"
    finding:
      watch: "Outstanding host I/O is averaging {value:.0f}, above the {threshold:.0f} illustrative ceiling."
      critical: "Outstanding host I/O is averaging {value:.0f} — hosts are likely queueing rather than the array being the limiter."
    investigate:
      - "Identify which hosts/volumes are driving the outstanding I/O using per-host or per-volume queue-depth data if available."
      - "Check whether host-side queue-depth settings (HBA/driver) exceed the array's recommended per-target limits."
      - "Look for a recent workload change (new application, backup window, batch job) coinciding with the increase."
    remediate:
      - "Tune host HBA/OS queue-depth settings down to Pure's documented per-target/per-LUN recommendations if they're set too aggressively."
      - "Spread the offending workload across more volumes/paths if a single LUN is saturating a queue."
      - "If queue depth is high but array-side latency and back-end metrics are clean, this is host- or application-driven — coordinate with the application owner rather than tuning the array."

  - id: network_errors
    category: frontend
    label: "Network Interface Errors"
    unit: "errors/min"
    # purefa_network_interface_performance_errors is real and confirmed, but
    # it's generic (no confirmed label distinguishing FC from Ethernet
    # interfaces). This sums across ALL interfaces on the array. If you can
    # identify your FC interfaces' label value (check your /metrics output —
    # likely an `interface` or `name` label following a ctX.FCn pattern),
    # add it here, e.g. interface=~"ct.*\\.FC.*", to scope this to fabric
    # ports specifically.
    # Industry practice (Brocade/Cisco FC troubleshooting guidance, general
    # Ethernet physical-layer diagnostics) treats CRC/link errors as a fault
    # to eliminate, not a rate to tolerate — the accepted baseline is zero,
    # and any sustained nonzero count means a marginal cable/SFP/port.
    # severity_watch is a negligible epsilon rather than a literal 0: the
    # engine classifies with value >= watch, so 0 exactly would misclassify
    # an actually-clean link (which reports precisely 0.0) as permanently
    # "Watch". Any real error pushes the rate well above this epsilon.
    query: 'sum(rate(purefa_network_interface_performance_errors{array="{array}"}[5m])) * 60'
    comparison: gt
    severity_watch: 0.01
    severity_critical: 5
    threshold_label: "> 0 / min — any sustained rate is a physical-layer fault"
    finding:
      watch: "Network interface errors are occurring ({value:.2f}/min) — industry practice treats any sustained nonzero rate as a physical-layer fault, not background noise. Check cabling/SFPs."
      critical: "Network interface error rate is {value:.1f}/min — an actively degrading link, not array load."
    investigate:
      - "Identify the specific interface(s) contributing to the error count from the array's own port statistics."
      - "Check the physical layer first: cable seating, SFP health/optical power, and switch-port error counters on the other end."
      - "Review recent cabling, SFP, or switch firmware changes around the time errors started."
    remediate:
      - "Reseat or replace the affected cable/SFP and confirm the error rate drops to zero, not just below threshold."
      - "If the switch-side port also shows errors, engage the network team to replace the port or move the connection."
      - "Fail over to a redundant path while the faulty link is repaired, if multipathing is configured."

  - id: replication_lag
    category: backend
    label: "Replication Lag (avg)"
    unit: sec
    # purefa_pod_replica_links_lag_average_msec is real and confirmed,
    # reported per pod/replica-link in milliseconds. This averages across
    # all links on the array; scope to one target with a pod/link label
    # filter once you've confirmed its exact name in your output.
    query: 'avg(purefa_pod_replica_links_lag_average_msec{array="{array}"}) / 1000'
    comparison: gt
    severity_watch: 90
    severity_critical: 180
    threshold_label: "< 90 sec (illustrative)"
    finding:
      watch: "Replication lag is averaging {value:.0f}s, above the {threshold:.0f}s illustrative target."
      critical: "Replication lag is averaging {value:.0f}s — recovery point objective is at risk if this persists."
    investigate:
      - "Check the replication_bandwidth panel below for the same window — rising lag with flat bandwidth suggests the link is saturated; rising lag with rising bandwidth suggests the source write rate is simply outpacing steady-state capacity."
      - "Confirm the target array's own health and capacity — a slow or full target array causes lag on every source relationship."
      - "Review the write change rate on the source during the lag window — a burst of writes can outpace steady-state replication bandwidth."
    remediate:
      - "If the replication link itself is saturated, increase bandwidth or schedule heavy replication-driving workloads outside peak hours."
      - "If the target array is the bottleneck, address its performance/capacity directly — treat it as its own array in this dashboard."
      - "Review Pure's recommended replication link sizing for your write change rate and adjust if consistently undersized."

  - id: replication_bandwidth
    category: backend
    label: "Replication Bandwidth"
    unit: "MB/s"
    # purefa_pod_replica_links_performance_bandwidth_bytes is real and
    # confirmed directly from the exporter's own source
    # (internal/openmetrics-exporter/pod_replica_links_performance_collector.go
    # in PureStorage-OpenConnect/pure-fa-openmetrics-exporter — this metric
    # doesn't appear in the project's own specification/metrics/purefa-metrics.md
    # doc, which marks its pod-metrics section "TODO", so the collector
    # source is the only place this is actually documented). `dimension`
    # is `bytes_per_sec_from_remote` / `bytes_per_sec_to_remote` /
    # `bytes_per_sec_total`, summed across every replica link on the array.
    # Workload characterization, same framing as the IOPS/bandwidth panels
    # elsewhere in this file — the point is correlating against
    # replication_lag above, not an alert to tune on its own.
    query: 'sum(purefa_pod_replica_links_performance_bandwidth_bytes{array="{array}",dimension="bytes_per_sec_total"}) / 1000000'
    comparison: gt
    informational: true
    severity_watch: 1000
    severity_critical: 2000
    threshold_label: "illustrative only — set from your own baseline"
    finding:
      watch: "Replication bandwidth is averaging {value:.0f} MB/s — this threshold is a placeholder; replace it with your array's own observed normal range."
      critical: "Replication bandwidth is averaging {value:.0f} MB/s — this threshold is a placeholder; replace it with your array's own observed normal range."
    investigate:
      - "Correlate against replication_lag above — bandwidth pegged near the link's known capacity while lag climbs points at the link, not the array."
      - "First confirm whether this is actually unusual relative to this array's own historical baseline (use the 7D/30D view), since this threshold is a placeholder."
    remediate:
      - "Replace the illustrative threshold in config/thresholds/pure_flasharray.yml with a value derived from this array's own observed normal range, or from the replication link's actual provisioned capacity."

  - id: pool_saturation
    category: backend
    label: "Capacity Utilization"
    unit: "%"
    # purefa_array_space_utilization is real, confirmed, and already a
    # percentage — no unit conversion needed.
    #
    # 75%/85% line up with the general storage-industry capacity convention
    # (alert around 75%, treat 85-90%+ as critical — the same logic behind
    # NetApp's own 80-85% aggregate-growth guidance, see netapp_ontap.yml):
    # performance on any array degrades as free space gets scarce, and flash
    # arrays specifically need working room for garbage collection/wear
    # leveling. Not a Pure-published SLA, but not arbitrary either.
    query: 'avg(purefa_array_space_utilization{array="{array}"})'
    comparison: gt
    severity_watch: 75
    severity_critical: 85
    threshold_label: "< 75% — general storage capacity convention"
    finding:
      watch: "Capacity utilization is at {value:.0f}%, above the {threshold:.0f}% illustrative guidance."
      critical: "Capacity utilization is at {value:.0f}% — capacity, not just performance, is now a near-term risk."
    investigate:
      - "Break down capacity usage by volume/pod to identify what's driving growth."
      - "Check the array's own data-reduction ratio for any recent regression (e.g. a new, less-compressible workload)."
      - "Review snapshot retention policies — accumulated snapshots are a common silent capacity driver."
    remediate:
      - "Reclaim space via expired-snapshot cleanup or reduced retention if snapshots are the driver."
      - "Plan a capacity expansion (additional shelf/array) if growth is workload-driven and expected to continue."
      - "Migrate or archive cold data off the array if a specific dataset is responsible for the growth."
