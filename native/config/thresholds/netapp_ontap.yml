# Plumb — NetApp ONTAP best-practice thresholds
#
# Collected via NetApp's own official Harvest poller (github.com/NetApp/harvest),
# not a custom scraper — Harvest does the authenticated REST/RestPerf
# collection against the cluster and exposes a plain local Prometheus
# endpoint that Plumb's bundled Prometheus scrapes directly.
#
# Metric names below (volume_avg_latency, node_cpu_busy, aggr_disk_busy,
# snapmirror_lag_time, nic_util_percent, nic_rx_crc_errors,
# aggr_space_used_percent) are verified against Harvest's own published
# Grafana dashboards (github.com/NetApp/harvest/grafana/dashboards/cmode/)
# as of August 2026. Harvest's exact label set can still vary by version —
# if a panel shows no data, run:
#
#   curl http://127.0.0.1:<poller-port>/metrics | grep <metric_name>
#
# against the running poller (see data/generated/harvest.yml for assigned
# ports) and adjust the query here.
#
# NetApp's own documentation is explicit that latency thresholds are
# workload-dependent, not universal (their own KB example: a warning at
# 12ms / critical at 15ms for one Exchange workload that crashes past 20ms).
# The numbers below are illustrative starting points for that same reason —
# tune severity_watch / severity_critical to what's normal for each
# workload, not the other way around.

metrics:
  - id: volume_avg_latency
    category: frontend
    label: "Volume Latency (avg)"
    unit: ms
    query: 'avg(volume_avg_latency{array="{array}"})'
    comparison: gt
    severity_watch: 8
    severity_critical: 15
    threshold_label: "< 8 ms (illustrative — workload dependent)"
    finding:
      watch: "Average volume latency is {value:.1f}ms, above the {threshold:.0f}ms illustrative guidance."
      critical: "Average volume latency is {value:.1f}ms — NetApp's own guidance treats sustained latency in this range as workload-impacting for most applications."
    investigate:
      - "Identify which volume(s) are driving the average using the array's own per-volume latency breakdown."
      - "Check whether the affected volume(s) share an aggregate with a workload showing high disk or CPU busy (see the back-end panels)."
      - "Review QoS policy groups for the affected volumes — a throughput/IOPS ceiling can present as latency."
      - "Check the volume_avg_latency_read/volume_avg_latency_write panels below — a one-sided spike often points to a specific workload, not the cluster generally."
    remediate:
      - "If a specific volume is responsible, review or adjust its QoS policy group limits."
      - "If the underlying aggregate's disks or the node's CPU are also elevated, address that back-end resource rather than the volume in isolation."
      - "Consider moving the volume to a less-contended aggregate or node if the imbalance persists."

  - id: volume_avg_latency_read
    category: frontend
    label: "Volume Latency — Read"
    unit: ms
    # ONTAP's REST API performance objects (iops/latency/throughput) return
    # read/write/other/total sub-fields — documented as the "RWOT"
    # convention, available cluster-wide as of ONTAP 9.6
    # (docs.netapp.com/us-en/ontap-automation/rest/performance_metrics.html).
    # internal/netappnative/ontap.go's collectClusterLatency emits this
    # best-effort: if a given ONTAP version's /api/cluster/metrics doesn't
    # populate the read/write sub-fields, this panel simply shows
    # "unavailable" rather than a wrong number — I could not get a live
    # cluster's literal response to confirm the field names against this
    # exact endpoint (vs. the per-object ones, which are well-documented).
    query: 'avg(volume_avg_latency_read{array="{array}"})'
    comparison: gt
    severity_watch: 8
    severity_critical: 15
    threshold_label: "< 8 ms (illustrative — workload dependent)"
    finding:
      watch: "Average read latency is {value:.1f}ms, above the {threshold:.0f}ms illustrative guidance — check volume_avg_latency_write to see whether this is read-isolated."
      critical: "Average read latency is {value:.1f}ms — a read-isolated spike often points to cache misses or a specific workload, not the cluster broadly."
    investigate:
      - "If write latency is clean but read latency isn't, check for a cold working set or a change in read pattern for the affected volume(s)."
      - "Correlate against aggr_disk_busy — a read latency spike with high disk busy points to the media/aggregate, not the network path."
    remediate:
      - "If isolated to specific volumes, review their read-cache sizing and working-set fit before treating this as a cluster-wide issue."
      - "If broad and correlated with back-end signals, treat as a general cluster issue — see the combined volume_avg_latency finding's remediation."

  - id: volume_avg_latency_write
    category: frontend
    label: "Volume Latency — Write"
    unit: ms
    query: 'avg(volume_avg_latency_write{array="{array}"})'
    comparison: gt
    severity_watch: 8
    severity_critical: 15
    threshold_label: "< 8 ms (illustrative — workload dependent)"
    finding:
      watch: "Average write latency is {value:.1f}ms, above the {threshold:.0f}ms illustrative guidance — check volume_avg_latency_read to see whether this is write-isolated."
      critical: "Average write latency is {value:.1f}ms — a write-isolated spike often points to snapshot/dedup/replication activity competing for the write path, not the cluster broadly."
    investigate:
      - "If read latency is clean but write latency isn't, check recent snapshot schedules, dedup/compression scans, or SnapMirror activity."
      - "Correlate against node_cpu_busy and aggr_disk_busy — a write latency spike with both clean points to the network path, not the array."
    remediate:
      - "If correlated with background jobs, reschedule them to a lower-impact window rather than tuning the write path directly."
      - "If broad and correlated with back-end signals, treat as a general cluster issue — see the combined volume_avg_latency finding's remediation."

  - id: nic_utilization
    category: frontend
    label: "NIC Utilization (max port)"
    unit: "%"
    # Not a NetApp-published number, but not arbitrary either: 75% is the
    # standard N+1 redundancy engineering convention — if this port's
    # partner fails over onto it, traffic roughly doubles, so headroom
    # below ~75-80% is what keeps a failover from also saturating the
    # survivor. Tune to your actual failover ratio (some environments are
    # N+2 or asymmetric) rather than treating 75% as universal.
    query: 'max(nic_util_percent{array="{array}"})'
    comparison: gt
    severity_watch: 75
    severity_critical: 90
    threshold_label: "< 75% — N+1 failover headroom convention"
    finding:
      watch: "A network port is at {value:.0f}% utilization, above the 75% guidance that preserves headroom for failover."
      critical: "A network port is at {value:.0f}% utilization — a failover event would likely saturate the remaining path."
    investigate:
      - "Identify which physical port is at high utilization and which LIFs/workloads are bound to it."
      - "Check whether traffic is evenly distributed across available ports (ifgrp/LACP) or concentrated on one link."
      - "Confirm current failover capacity — what utilization would result if a partner port failed over onto this one."
    remediate:
      - "Rebalance LIFs across available physical ports if traffic is unevenly distributed."
      - "Add additional network ports/interface group members if the cluster has outgrown current bandwidth."
      - "Schedule any planned failover testing for a low-traffic window until headroom is restored."

  - id: nic_errors
    category: frontend
    label: "NIC CRC / Receive Errors"
    unit: "errors/min"
    # Industry practice (Brocade/Cisco FC troubleshooting guidance, general
    # Ethernet physical-layer diagnostics) treats CRC/link errors as a fault
    # to eliminate, not a rate to tolerate — the accepted baseline is zero,
    # and any sustained nonzero count means a marginal cable/SFP/port.
    # severity_watch is a negligible epsilon rather than a literal 0: the
    # engine classifies with value >= watch, so 0 exactly would misclassify
    # an actually-clean link (which reports precisely 0.0) as permanently
    # "Watch". Any real error pushes the rate well above this epsilon.
    query: 'sum(rate(nic_rx_crc_errors{array="{array}"}[5m])) * 60'
    comparison: gt
    severity_watch: 0.01
    severity_critical: 5
    threshold_label: "> 0 / min — any sustained rate is a physical-layer fault"
    finding:
      watch: "NIC CRC errors are occurring ({value:.2f}/min) — industry practice treats any sustained nonzero rate as a physical-layer fault, not background noise. Check the cable/SFP."
      critical: "NIC CRC error rate is {value:.1f}/min — an actively degrading link, not cluster load."
    investigate:
      - "Identify the specific port from the array's own per-port error breakdown."
      - "Check the physical layer: cable, SFP, and the switch port's own error counters."
      - "Review recent cabling, SFP, or switch-side changes."
    remediate:
      - "Reseat or replace the cable/SFP on the affected port."
      - "Engage the network team if the switch-side port also reports errors."
      - "Fail the LIF over to a healthy port while the link is repaired."

  - id: node_cpu_busy
    category: backend
    label: "Node CPU Busy"
    unit: "%"
    # 70% is not a placeholder — it's NetApp's own documented guidance
    # (support KB "This system is reporting a high average CPU utilization"):
    # sustained CPU above 70% per node on ONTAP 9.7+ (60% on 9.6 and earlier)
    # is NetApp's own trigger to review and relocate workloads. 85% critical
    # is a reasonable buffer above that documented line, not itself an
    # officially published number.
    #
    # This is a CLUSTER-WIDE AVERAGE across every node — real and correct,
    # but it has a genuine blind spot: two nodes at 95%/5% average to ~50%,
    # comfortably under 70%, silently hiding a real single-node hot spot.
    # node_breakdown_query answers exactly the question this metric's own
    # investigate text already asks ("both nodes elevated, or only one?")
    # using each node's own delta(raw)/delta(base) — see
    # internal/netappnative/ontap.go's collectNodeCPU.
    query: 'avg(node_cpu_busy{array="{array}"})'
    node_breakdown_query: 'node_cpu_busy_by_node{array="{array}"}'
    # A hot node here has nowhere else for its CPU load to go: ONTAP does
    # not automatically rebalance workloads across an HA pair, and an
    # aggregate (and the CPU work behind it) is owned by exactly one node
    # until someone deliberately relocates it
    # (docs.netapp.com/us-en/ontap/disks-aggregates/relocate-aggregate-ownership-task.html).
    # In a typical 2-node cluster that's half the system with nothing
    # compensating — see config.MetricDef.EscalateToNodeSeverity for the
    # full reasoning and the contrast with StorageGRID's redundant design.
    escalate_to_node_severity: true
    comparison: gt
    severity_watch: 70
    severity_critical: 85
    threshold_label: "< 70% sustained — NetApp's own documented guidance"
    finding:
      watch: "Node CPU busy is averaging {value:.0f}%, above NetApp's own 70% sustained guidance for ONTAP 9.7+."
      critical: "Node CPU busy is averaging {value:.0f}% — the controller itself is now a contributing factor, not just the path to it."
    investigate:
      - "Check which processes/workloads are consuming CPU via Harvest's node/CPU-domain breakdown, if enabled."
      - "Correlate against recent workload changes: new volumes, increased snapshot schedules, or deduplication/compression jobs."
      - "Check whether both nodes in an HA pair are elevated, or only one (possible uneven workload distribution)."
    remediate:
      - "Rebalance volumes/workloads across nodes in the HA pair if one node is consistently hotter."
      - "Reschedule CPU-intensive background jobs (dedup, compression scans) to off-peak hours."
      - "If sustained cluster-wide, this is a capacity signal — plan a controller upgrade or additional node."

  - id: aggr_disk_busy
    category: backend
    label: "Aggregate Disk Busy"
    unit: "%"
    # Unlike node_cpu_busy, NetApp does not publish a specific disk-busy%
    # target in public documentation (their KB on disk utilization/latency
    # resolution paths references "beyond critical threshold" without
    # stating the number). These values are modeled by analogy to the
    # documented CPU guidance, not independently confirmed for disks —
    # still a reasonable engineering default, just a real gap.
    #
    # Same masking risk as node_cpu_busy: this is a fleet-wide average
    # across every disk, which can hide one degraded/rebuilding disk behind
    # dozens of healthy ones. node_breakdown_query surfaces the worst 10
    # disks by ID (topk, not every disk — a real cluster can have hundreds
    # and the breakdown UI has no pagination of its own).
    query: 'avg(aggr_disk_busy{array="{array}"})'
    node_breakdown_query: 'topk(10, aggr_disk_busy_by_node{array="{array}"})'
    # Same reasoning as node_cpu_busy above: an aggregate's disks are
    # owned by exactly one node with no automatic rebalancing, so a hot
    # aggregate is a real, unmitigated problem for the whole cluster's
    # badge to reflect, not just its own volumes.
    escalate_to_node_severity: true
    comparison: gt
    severity_watch: 70
    severity_critical: 85
    threshold_label: "< 70% sustained (engineering estimate — not independently published)"
    finding:
      watch: "Aggregate disk busy is averaging {value:.0f}%, above the 70% guidance."
      critical: "Aggregate disk busy is averaging {value:.0f}% — the backing disks are the likely bottleneck, not the network path."
    investigate:
      - "Identify which aggregate and which volumes on it are driving disk activity."
      - "Check the aggregate's RAID group health — a degraded/rebuilding RAID group significantly raises disk busy."
      - "Review recent growth in random I/O workloads, which stress disk busy more than sequential ones."
    remediate:
      - "If a RAID group is degraded, prioritize replacing the failed disk to complete reconstruction."
      - "Rebalance volumes to a less-busy aggregate if available."
      - "Plan additional disks/shelves for the aggregate if this is sustained capacity-driven contention."

  - id: snapmirror_lag
    category: backend
    label: "SnapMirror Lag"
    unit: sec
    query: 'max(snapmirror_lag_time{array="{array}"})'
    comparison: gt
    severity_watch: 90
    severity_critical: 180
    threshold_label: "< 90 sec (illustrative)"
    finding:
      watch: "SnapMirror lag is {value:.0f}s, above the 90s target."
      critical: "SnapMirror lag is {value:.0f}s — recovery point objective is at risk if this persists."
    investigate:
      - "Check the replication network path's throughput/utilization between source and destination."
      - "Confirm the destination cluster's own health — a slow or busy destination causes lag on every incoming relationship."
      - "Review the source volume's change rate for a recent spike (bulk data load, migration)."
    remediate:
      - "Increase replication network bandwidth or schedule heavy write workloads outside the replication window."
      - "Address destination cluster performance directly if it's the limiting factor."
      - "Review SnapMirror policy/schedule — more frequent, smaller transfers may keep lag lower than large infrequent ones."

  - id: snapmirror_bandwidth
    category: backend
    label: "SnapMirror Bandwidth"
    unit: "MB/s"
    # total_transfer_bytes is real, but NetApp Harvest's own SnapMirror
    # config (conf/rest/9.12.0/snapmirror.yaml) sources it from
    # api/private/cli/snapmirror — an unsupported CLI-passthrough endpoint,
    # not the documented api/snapmirror/relationships REST resource
    # snapmirror_lag above uses. NetApp can change or remove api/private/cli/*
    # without notice; treat this one specifically as lower-confidence than
    # the rest of this file. If it's unavailable on your cluster (older
    # ONTAP, restricted RBAC role), this panel degrades to "unavailable" —
    # snapmirror_lag and everything else here is unaffected.
    query: 'rate(snapmirror_bandwidth_bytes{array="{array}"}[5m]) / 1000000'
    comparison: gt
    informational: true
    severity_watch: 500
    severity_critical: 1000
    threshold_label: "illustrative only — set from your own baseline (sourced from an unsupported private API — see comment)"
    finding:
      watch: "SnapMirror transfer rate is averaging {value:.0f} MB/s — this threshold is a placeholder; replace it with your cluster's own observed normal range."
      critical: "SnapMirror transfer rate is averaging {value:.0f} MB/s — this threshold is a placeholder; replace it with your cluster's own observed normal range."
    investigate:
      - "Correlate against snapmirror_lag above — bandwidth pegged near the link's known capacity while lag climbs points at the link, not the cluster."
      - "First confirm whether this is actually unusual relative to this cluster's own historical baseline (use the 7D/30D view), since this threshold is a placeholder."
      - "If this panel shows unavailable, api/private/cli/snapmirror may not exist on this ONTAP version or the configured account's permission level — snapmirror_lag is unaffected."
    remediate:
      - "Replace the illustrative threshold in config/thresholds/netapp_ontap.yml with a value derived from this cluster's own observed normal range, or from the replication link's actual provisioned capacity."

  - id: aggr_capacity
    category: backend
    label: "Aggregate Capacity Used"
    unit: "%"
    # Not a placeholder — 80% matches NetApp's own documented guidance to
    # grow an aggregate as it approaches 80-85% utilization for performance
    # reasons (separate from ONTAP's own nearly-full/full EMS thresholds,
    # which default to 95%/98% and are about avoiding outright ENOSPC, not
    # performance). 90% critical matches the general storage-industry
    # capacity convention (avoid sustained utilization above ~85-90%).
    query: 'avg(aggr_space_used_percent{array="{array}"})'
    comparison: gt
    severity_watch: 80
    severity_critical: 90
    threshold_label: "< 80% — NetApp's own aggregate-growth guidance"
    finding:
      watch: "Aggregate capacity is at {value:.0f}%, above the 80% guidance — reduction efficiency or growth should be reviewed."
      critical: "Aggregate capacity is at {value:.0f}% — ONTAP's own performance degrades as aggregates approach full, on top of the capacity risk."
    investigate:
      - "Break down aggregate usage by volume to identify what's driving growth."
      - "Check volume-level snapshot reserve and retention — accumulated snapshots are a common silent driver."
      - "Review storage-efficiency (dedup/compression) savings for any recent regression."
    remediate:
      - "Reclaim space via snapshot cleanup or reduced retention where safe."
      - "Move or archive cold volumes to a less-utilized aggregate or tier."
      - "Plan a capacity expansion if growth is workload-driven and ongoing — ONTAP performance also degrades as aggregates fill."
